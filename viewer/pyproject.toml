[project]
name = "rawcam-viewer"
version = "0.1.0"
description = "GPU-accelerated PySide6 viewer and controller for Raspberry Pi RAW10/12 camera service"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PyOpenGL>=3.1.7",
    "numpy>=2.0",
    "Pillow>=10.0",
    "av>=14.0",
]

[project.scripts]
rawcam-viewer = "rawcam_viewer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
