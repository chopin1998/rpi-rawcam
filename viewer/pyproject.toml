[project]
name = "rawcam-viewer"
version = "0.1.0"
description = "GPU-accelerated PySide6 viewer and controller for Raspberry Pi RAW10/12 camera service"
dependencies = [
    "PySide6",
    "PyOpenGL",
    "numpy",
    "Pillow",
    "av",
]

[project.scripts]
rawcam-viewer = "rawcam_viewer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
